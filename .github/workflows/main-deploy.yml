name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/main-deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build
        working-directory: backend
        run: sam build

      - name: Deploy
        working-directory: backend
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          NOVO_URL: ${{ secrets.NOVO_URL }}
          NOVO_TOKEN: ${{ secrets.NOVO_TOKEN }}
          NOVO_ACCESS_CODE: ${{ secrets.NOVO_ACCESS_CODE }}
        run: |
          sam deploy \
            --stack-name bio-ai-assistant \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "GroqApiKeys=\"$GROQ_API_KEYS\"" \
              "QdrantUrl=\"$QDRANT_URL\"" \
              "QdrantApiKey=\"$QDRANT_API_KEY\"" \
              "AllowedOrigin=\"$ORIGIN\"" \
              "NovoUrl=\"$NOVO_URL\"" \
              "NovoToken=\"$NOVO_TOKEN\"" \
              "NovoAccessCode=\"$NOVO_ACCESS_CODE\""

      - name: Show API URL
        run: |
          aws cloudformation describe-stacks --stack-name bio-ai-assistant \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text
