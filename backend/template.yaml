AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: T-Dry-Lab API

Parameters:
  GroqApiKeys:
    Type: String
    NoEcho: true
    Description: Comma-separated Groq API keys (rotated on rate limit)
  GroqModel:
    Type: String
    Default: llama-3.3-70b-versatile
  QdrantUrl:
    Type: String
    Default: ''
  QdrantApiKey:
    Type: String
    NoEcho: true
    Default: ''
  AllowedOrigin:
    Type: String
    Default: '*'
  BinderUrl:
    Type: String
    Default: ''
  ScoreUrl:
    Type: String
    Default: ''
  BotanicUrl:
    Type: String
    Default: ''
  NovoUrl:
    Type: String
    Default: ''
    Description: Modal base URL from services/novo/modal_app.py (the tdry-novo-api endpoint)
  NovoToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Bearer token shared with the Modal secret novo-aws (NOVO_TOKEN)
  NovoAccessCode:
    Type: String
    NoEcho: true
    Default: ''
    Description: Code users must enter to start a campaign
  NovoRetentionDays:
    Type: Number
    Default: 90

Globals:
  Function:
    Runtime: python3.11
    CodeUri: src/
    Timeout: 29
    MemorySize: 512
    Environment:
      Variables:
        GROQ_API_KEYS: !Ref GroqApiKeys
        GROQ_MODEL: !Ref GroqModel
        QDRANT_URL: !Ref QdrantUrl
        QDRANT_API_KEY: !Ref QdrantApiKey
        BINDER_URL: !Ref BinderUrl
        SCORE_URL: !Ref ScoreUrl
        BOTANIC_URL: !Ref BotanicUrl
        NOVO_URL: !Ref NovoUrl
        NOVO_TOKEN: !Ref NovoToken
        NOVO_ACCESS_CODE: !Ref NovoAccessCode
        NOVO_BUCKET: !Ref NovoBucket

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Content-Type]

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: search.handler
      Events:
        Search:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /proteins/search
            Method: POST

  PredictFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: predict.handler
      Events:
        Predict:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /docking/predict
            Method: POST

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: agent.handler
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /agent/chat
            Method: POST

  RnaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rna.handler
      Events:
        Rna:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /rna/design
            Method: POST

  PlantFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: plant.handler
      Events:
        Plant:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /plant/variants
            Method: POST

  LookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lookup.handler
      Events:
        Lookup:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /lookup
            Method: POST

  NovoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-campaigns
            Status: Enabled
            Prefix: novo/
            ExpirationInDays: !Ref NovoRetentionDays

  NovoWriter:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: novo-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${NovoBucket.Arn}/novo/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt NovoBucket.Arn

  NovoSubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: novo.submit
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref NovoBucket
      Events:
        NovoSubmit:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /novo/submit
            Method: POST

  NovoStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: novo.status
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref NovoBucket
      Events:
        NovoStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /novo/status
            Method: POST

  NovoResumeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: novo.resume
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref NovoBucket
      Events:
        NovoResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /novo/resume
            Method: POST

  NovoDownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: novo.download
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref NovoBucket
      Events:
        NovoDownload:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /novo/download
            Method: POST

Outputs:
  NovoBucketName:
    Value: !Ref NovoBucket
  NovoWriterUser:
    Value: !Ref NovoWriter
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
